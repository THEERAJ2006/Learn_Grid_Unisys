name: learngrid
description: "LearnGrid - Offline-First Federated AI Learning Platform for underserved communities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Core UI & Navigation
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  google_fonts: ^6.1.0

  # Immutable Models
  freezed: ^2.4.0
  freezed_annotation: ^2.4.0
  json_serializable: ^6.7.0

  # Local Database (SQLite via Drift ORM)
  drift: ^2.14.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # AI / ML Inference
  tflite_flutter: ^0.12.1
  # ONNX inference (implementation picked per-platform; see lib/ai/runtime/)
  flutter_onnxruntime: ^1.7.0

  # Content Processing
  syncfusion_flutter_pdfviewer: ^23.0.0
  docx_to_text: ^1.0.1
  video_player: ^2.8.0
  just_audio: ^0.9.36

  # NLP / Search
  ml_linalg: ^13.0.0

  # Connectivity
  connectivity_plus: ^5.0.0
  http: ^1.1.0
  dio: ^5.4.0

  # P2P (Android)
  nearby_connections: ^4.3.0

  # File Handling
  file_picker: ^6.1.0
  permission_handler: ^11.0.0
  open_filex: ^4.3.2

  # UI Components
  flutter_animate: ^4.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.65.0
  lottie: ^2.7.0

  # Utilities
  uuid: ^4.1.0
  intl: ^0.18.0
  logger: ^2.0.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_dotenv: ^5.1.0

  # Settings persistence / secure secrets
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.2

  # Text Recognition (OCR)
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/
    - assets/content/
    - assets/icons/
    - flutter_version.txt
